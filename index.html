<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#1b4965" />
  <title>Mediterranean Island Spinner</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Islands of the Mediterranean</h1>
      <p>Spin the reel; the map attends to whichever island fortune selects.</p>
    </header>

    <div class="stage">
      <div class="map-wrap">
        <svg id="map" role="img" aria-label="Map of the Mediterranean"></svg>
        <button id="resetBtn" class="reset-btn" type="button">Zoom out ⤢</button>
        <div id="badge" class="map-badge">
          <h2 id="badgeTitle"></h2>
          <p id="badgeText"></p>
        </div>
      </div>

      <div class="controls">
        <div class="slot">
          <div class="slot-title">The Reel</div>
          <div class="slot-window">
            <div class="slot-reel" id="reel"></div>
            <div class="slot-selector" aria-hidden="true">
              <span class="slot-arrow left">▶</span>
              <span class="slot-arrow right">◀</span>
            </div>
          </div>
        </div>
        <button id="playBtn" class="play-btn" type="button">Spin</button>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </div>

    <footer>Tap any island on the map to explore it too.</footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
